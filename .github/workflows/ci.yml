name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commits (the tag is in the comment), so a moved tag can't change what runs here.
jobs:
  build:
    name: Library, command and site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/test/package-lock.json
      - run: dotnet test --configuration Release
      - name: No known-vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
      - run: dotnet pack src/Amortizer --configuration Release --output nupkg
      - run: dotnet pack src/Amortizer.Cli --configuration Release --output nupkg
      - run: dotnet publish site/Amortizer.Web --configuration Release --output out
      - name: Site in Chromium, with the production headers
        working-directory: site/test
        run: |
          npm ci
          npm audit --audit-level=moderate
          npx playwright install --with-deps chromium
          node e2e.cjs ../../out/wwwroot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nupkg
          path: nupkg/*.nupkg
